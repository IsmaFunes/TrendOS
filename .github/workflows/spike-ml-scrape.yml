name: Spike - MercadoLibre bot-gate check

# One-off, manual-only diagnostic (see scripts/ml-spike/spike.mjs for the
# full rationale). Answers a single question: does a stealth-Playwright
# browser running on a GitHub Actions runner clear MercadoLibre Argentina's
# bot-gate, or does it hit the same account-verification redirect that a
# plain fetch does from other cloud/datacenter IPs? That answer decides
# whether the planned niche-level ML scraper cache is viable as designed.
#
# Not on any schedule and not wired into the real scrape pipeline — trigger
# it manually from the Actions tab (or `gh workflow run`) when you want the
# answer, then read the job log's "=== VERDICT ===" line.

on:
  workflow_dispatch: {}

jobs:
  spike:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run MercadoLibre bot-gate spike
        run: node scripts/ml-spike/spike.mjs
