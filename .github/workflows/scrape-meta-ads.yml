name: Scrape Meta Ads Preview

# Runs the Meta Ad Library worker (scripts/meta-ad-scraper/scrape.mjs)
# unattended, on a schedule. Convex itself can't run Playwright/a browser,
# so this is the actual "does the scraping happen automatically" piece —
# Convex crons (convex/crons.ts) only ever decide WHAT needs scraping and
# drop a job in the queue; this workflow is what claims and runs it.
#
# Secrets live in the "Preview" GitHub Environment (Settings -> Environments
# -> Preview), not plain repo secrets, since they point at the Convex DEV
# deployment. `environment:` below is what makes those visible to this job —
# without it, environment-scoped secrets resolve to empty strings.
#   META_ADS_INGEST_SECRET - must match the Convex deployment's env var
#   CONVEX_URL             - the target deployment's URL (currently dev:
#                            https://proficient-salmon-481.convex.cloud)

# Two triggers, belt-and-suspenders:
#  - workflow_dispatch is called directly from Convex the moment the daily
#    cron creates a fresh batch of jobs (convex/radar/niches.ts
#    enqueueDailyScrapeJobs -> see convex/radar/githubDispatch.ts) — the
#    day's batch starts draining within seconds instead of waiting for the
#    schedule's next tick.
#  - the 15-min schedule is the fallback: covers GITHUB_ACTIONS_TOKEN not
#    being configured yet, a dispatch call failing, or just draining the
#    rest of a large daily batch (~16 niches x 5 countries) across
#    successive runs. Either way this workflow just claims whatever's
#    pending and exits fast (no Meta traffic at all) when the queue is empty.
# Free to run this often — this repo is public, so Actions minutes are
# unlimited; only real cost is npm/Playwright setup time, cut via caching.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      force_niche_id:
        description: >-
          Optional: a specific radarNiches document ID (from the Convex
          dashboard) to force-scrape right now, even if it already has
          ads — bypasses the normal queue instead of waiting for this
          niche's turn. Leave empty for a normal queue-processing run.
        type: string
        default: ""
      force_country:
        description: >-
          Optional, only used with force_niche_id: scrape just one of the
          niche's countries (AR, US, BR, MX, ES). Leave empty to
          force-enqueue every country the niche targets.
        type: string
        default: ""
      debug:
        description: >-
          Save each term's Meta Ad Library page HTML as a downloadable
          artifact — for diagnosing why a scrape returns far fewer ads than
          a local run of the same terms (suspected CI-environment issue,
          not enabled by default since it adds real artifact storage).
        type: boolean
        default: false

# A run processing several niches (~1-3 min each) could still be going when
# the next 15-min tick fires. Queue behind the current run instead of racing
# it — two overlapping scrapes would mean two concurrent Chromium sessions
# hitting Meta at once, which is exactly the kind of thing worth avoiding.
concurrency:
  group: scrape-meta-ads
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    environment: Preview
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS dependencies only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run Meta Ad Library scrape worker
        env:
          META_ADS_INGEST_SECRET: ${{ secrets.META_ADS_INGEST_SECRET }}
          CONVEX_URL: ${{ secrets.CONVEX_URL }}
          META_ADS_DEBUG: ${{ inputs.debug && '1' || '' }}
          FORCE_NICHE_ID: ${{ inputs.force_niche_id }}
          FORCE_COUNTRY: ${{ inputs.force_country }}
        # Kept modest on purpose: with runs every 15 min, a big backlog
        # (e.g. right after the daily enqueue cron queues every active
        # niche x country at once) drains gradually across successive runs
        # instead of one run ballooning past the 15-min cadence and
        # queueing up concurrency waits. --force-niche ignores --max-jobs
        # anyway (it only ever claims that one niche's job, then the queue
        # looks empty to it and it stops).
        run: |
          if [ -n "$FORCE_NICHE_ID" ]; then
            if [ -n "$FORCE_COUNTRY" ]; then
              npm run scrape:meta-ads -- --force-niche "$FORCE_NICHE_ID" --force-country "$FORCE_COUNTRY" --max-jobs 5
            else
              npm run scrape:meta-ads -- --force-niche "$FORCE_NICHE_ID" --max-jobs 5
            fi
          else
            npm run scrape:meta-ads -- --max-jobs 5
          fi

      - name: Upload scrape debug HTML (manual debug runs only)
        if: always() && inputs.debug
        uses: actions/upload-artifact@v4
        with:
          name: scrape-debug-html
          path: scripts/meta-ad-scraper/debug/
          retention-days: 7
          if-no-files-found: ignore
